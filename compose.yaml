services:
  postgres:
    image: postgres:15.10-bookworm
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  metastore:
    image: apache/hive:4.0.0-alpha-2
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - warehouse:/opt/hive/data/warehouse
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9083"]
      interval: 5s
      timeout: 5s
      retries: 30

  hiveserver2:
    image: apache/hive:4.0.0-alpha-2
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://metastore:9083
    volumes:
      - warehouse:/opt/hive/data/warehouse
      - ./data:/data:ro
      - ./sql:/sql:ro
    depends_on:
      metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beeline", "-u", "jdbc:hive2://localhost:10000/default", "-n", "hive", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s

volumes:
  postgres:
  warehouse:
